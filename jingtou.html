  .stats div span{font-size:11px;color:#8d8da3}

  .bar{position:sticky;top:0;z-index:40;background:rgba(10,10,16,.92);border-bottom:1px solid #222232;padding:10px 12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

  .chip{padding:8px 15px;border-radius:20px;font-size:13px;cursor:pointer;border:1px solid #2c2c40;background:#171722;color:#9a9ab0;font-weight:600}
  .chip.on{background:rgba(232,179,75,.16);border-color:#e8b34b;color:#f5d98a}
  /* 主体 */
  .wrap{max-width:1200px;margin:0 auto;padding:20px 16px 80px}
  .sec{margin-top:32px}
  .sec h2{font-size:20px;letter-spacing:4px;padding-left:12px;border-left:4px solid #e8b34b;margin-bottom:14px}
  .sec .cnt{font-size:12px;color:#8d8da3;font-weight:400;margin-left:8px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
  .card{background:#14141f;border:1px solid #23233a;border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s}
  .card:hover{transform:translateY(-3px);border-color:var(--ac,#e8b34b);box-shadow:0 10px 30px rgba(0,0,0,.55)}

  .vslot{position:relative;width:100%;padding-top:56%;background:#0d0d15;border-bottom:1px solid #23233a}
  .vslot iframe,.vslot video{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
  .vempty{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#6b6b85;
    background:repeating-linear-gradient(45deg,#111119 0 14px,#0d0d15 14px 28px)}
  .vempty .play{width:44px;height:44px;border-radius:50%;border:2px solid var(--ac,#e8b34b);color:var(--ac,#e8b34b);display:flex;align-items:center;justify-content:center;font-size:15px}
  .vempty .txt{font-size:11px}
  .vtag{position:absolute;top:8px;left:8px;z-index:3;font-size:10px;background:rgba(0,0,0,.65);border:1px solid var(--ac,#e8b34b);color:var(--ac,#e8b34b);border-radius:6px;padding:2px 8px}

  .vedit:hover{color:#f5d98a;border-color:#e8b34b}

  .cbody{padding:13px 15px 15px}

  .cbody p{font-size:13px;color:#c6c2ba;line-height:1.7}
  .use{display:inline-block;margin-top:10px;font-size:12px;font-weight:600;border-radius:8px;padding:5px 10px}

  .modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(4,4,8,.85);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}

  .mbox .en{color:#8d8da3;font-size:12px;margin:4px 0 12px}

  .vbox .btns{display:flex;gap:10px;margin-top:14px}
  .vbox button{flex:1;padding:11px;border-radius:9px;font-weight:700;cursor:pointer;border:none;font-size:13px}
  .vbox .save{background:#e8b34b;color:#1a1206}
  .vbox .clear{background:transparent;border:1px solid #2c2c40;color:#9a9ab0}
  .empty{text-align:center;color:#8d8da3;padding:60px 0}
  .toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#1e1e2c;color:#f5d98a;border:1px solid #e8b34b;border-radius:20px;padding:8px 20px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:200}
  .toast.show{opacity:1}
  .top-btn{position:fixed;right:18px;bottom:18px;z-index:60;background:#e8b34b;color:#1a1206;border:none;border-radius:22px;padding:11px 18px;font-weight:800;cursor:pointer;display:none}

</style>
</head>

</div>

<div class="wrap" id="list"></div>
<button class="top-btn" id="topBtn">↑ 顶部</button>

<div class="modal" id="modal">

    <div class="mvideo" id="mVideo"></div>
    <dl id="mBody"></dl>
    <button class="close" onclick="closeModal()">关 闭</button>
  </div>
</div>

<div class="modal" id="vmodal">
  <div class="mbox vbox">
    <h3 style="font-size:18px">🎬 设置示范视频</h3>
    <div class="en" id="vTarget"></div>

    <div class="btns">
      <button class="clear" onclick="clearV()">清 除</button>
      <button class="save" onclick="saveV()">保 存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

function toast(m){var t=document.getElementById("toast");t.textContent=m;t.className="toast show";setTimeout(function(){t.className="toast";},1600);}
function persistV(){localStorage.setItem(VKEY,JSON.stringify(videos));document.getElementById("vCount").textContent=Object.keys(videos).length;}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function embedUrl(url){
  var m;
  if(url.indexOf("youtube.com")>=0){ m=url.match(/[?&]v=([\w-]+)/); if(m)return"https://www.youtube.com/embed/"+m[1]; m=url.match(/shorts\/([\w-]+)/); if(m)return"https://www.youtube.com/embed/"+m[1]; }
  if(url.indexOf("youtu.be/")>=0){ m=url.match(/youtu\.be\/([\w-]+)/); if(m)return"https://www.youtube.com/embed/"+m[1]; }
  if(url.indexOf("bilibili.com")>=0){ m=url.match(/BV\w+/); if(m)return"https://player.bilibili.com/player.html?bvid="+m[0]+"&autoplay=0"; }
  if(/\.(mp4|webm)(\?|$)/i.test(url)) return url;
  return "";
}
function vslotHTML(no){
  var url=videos[no]||"";
  var inner="";
  if(url){
    var e=embedUrl(url);
    if(e.indexOf(".mp4")>0||e.indexOf(".webm")>0){ inner='<video src="'+esc(e)+'" controls preload="metadata"></video>'; }
    else if(e){ inner='<iframe src="'+esc(e)+'" allowfullscreen loading="lazy"></iframe>'; }
    else{ inner='<div class="vempty" style="color:#f5d98a"><div class="play">↗</div><div class="txt">已存链接 · 点击卡片打开</div></div>'; }
  }else{
    inner='<div class="vempty"><div class="play">▶</div><div class="txt">示范视频位 · 右上角＋设置</div></div>';
  }
  return '<div class="vslot"><span class="vtag">'+(url?"🎬 示范":"视频位")+'</span>'+
    '<span class="vedit" onclick="openV(event,\''+no+'\')">＋设视频</span>'+inner+'</div>';
}
function cardHTML(x){
  var ac=COLORS[x.c];
  return '<div class="card" style="--ac:'+ac+'" onclick="openM(\''+x.no+'\')">'+
    vslotHTML(x.no)+
    '<div class="cbody">'+
    '<div class="no">'+x.f+' · '+x.u+'</div>'+
    '<h3>'+esc(x.n)+'</h3>'+
    '<div class="en-name">'+esc(x.en)+'</div>'+
    '<p>'+esc(x.s)+'</p>'+
    '<span class="use" style="color:'+ac+';background:'+USEBG[x.c]+'">▸ '+esc(x.u)+'</span>'+
    '</div></div>';
}
function render(){
  var groups=["景别","角度","运镜","焦段","光线","电商"];
  var html="";
  var total=0;
  for(var g=0;g<groups.length;g++){
    var name=groups[g];
    if(filter!=="all"&&filter!=="video"&&filter!==name)continue;
    var items=[];
    for(var i=0;i<D.length;i++){
      var x=D[i];
      if(x.f!==name)continue;
      if(kw&&(x.n+" "+x.en+" "+x.s+" "+x.u+" "+x.d.join(" ")).toLowerCase().indexOf(kw)<0)continue;
      if(filter==="video"&&!videos[x.no])continue;
      items.push(x);
    }
    if(!items.length)continue;
    total+=items.length;
    html+='<div class="sec"><h2>'+name+'<span class="cnt">'+items.length+' 个</span></h2><div class="grid">';
    for(var j=0;j<items.length;j++){ html+=cardHTML(items[j]); }
    html+='</div></div>';
  }
  document.getElementById("list").innerHTML=total?html:'<div class="empty">没有匹配的镜头，换个关键词试试</div>';
}
function openM(no){
  var x=null;
  for(var i=0;i<D.length;i++){ if(D[i].no===no){x=D[i];break;} }
  if(!x)return;
  document.getElementById("mName").textContent=x.n;
  document.getElementById("mEn").textContent=x.en+" · "+x.f+" · "+x.u;
  var url=videos[no]||"";
  var mv=document.getElementById("mVideo");
  if(url){
    var e=embedUrl(url);
    if(e.indexOf(".mp4")>0||e.indexOf(".webm")>0){ mv.innerHTML='<video src="'+esc(e)+'" controls autoplay></video>'; }
    else if(e){ mv.innerHTML='<iframe src="'+esc(e)+'" allowfullscreen></iframe>'; }
    else{ mv.innerHTML='<div class="vempty" style="color:#f5d98a"><div class="play">↗</div><div class="txt">该平台不允许嵌入 · <a href="'+esc(url)+'" target="_blank">点此新窗口打开视频 ↗</a></div></div>'; }
  }else{
    mv.innerHTML='<div class="vempty"><div class="play">▶</div><div class="txt">还没有示范视频 · 关闭后在卡片右上角「＋设视频」</div></div>';
  }
  document.getElementById("mBody").innerHTML=
    '<dt>� 句话理解</dt><dd>'+esc(x.s)+'</dd>'+
    '<dt>怎么拍</dt><dd>'+esc(x.d[0])+'</dd>'+
    '<dt>什么作用</dt><dd>'+esc(x.d[1])+'</dd>'+
    '<dt>电商怎么用</dt><dd>'+esc(x.d[2])+'</dd>'+
    '<dt>搭配建议</dt><dd>'+esc(x.d[3])+'</dd>';
  document.getElementById("modal").className="modal show";
}
function closeModal(){ document.getElementById("modal").className="modal"; document.getElementById("mVideo").innerHTML=""; }
function openV(ev,no){
  if(ev.stopPropagation)ev.stopPropagation();
  editNo=no;
  var x=null;
  for(var i=0;i<D.length;i++){ if(D[i].no===no){x=D[i];break;} }
  document.getElementById("vTarget").textContent=no+" "+x.n;
  document.getElementById("vUrl").value=videos[no]||"";
  document.getElementById("vmodal").className="modal show";
}
function saveV(){
  var v=document.getElementById("vUrl").value.replace(/^\s+|\s+$/g,"");
  if(v){ videos[editNo]=v; } else { delete videos[editNo]; }
  persistV(); closeV(); render();
  toast(v?"示范视频已保存 ✅":"已清除");
}
function clearV(){ delete videos[editNo]; persistV(); closeV(); render(); toast("已清除"); }
function closeV(){ document.getElementById("vmodal").className="modal"; }
