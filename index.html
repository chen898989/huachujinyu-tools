<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>花初锦遇 · 工具箱</title>
<style>
  :root{--bg:#101014;--gold:#d8c091;--gold2:#efe0bd;--ink:#ede9df;--sub:#96917f;--line:rgba(232,215,178,.14)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(800px 500px at 50% -10%,rgba(216,192,145,.08),transparent),var(--bg);color:var(--ink);min-height:100vh}
  .hero{text-align:center;padding:70px 16px 40px}
  .hero .mono{font-size:12px;letter-spacing:8px;color:var(--gold);opacity:.8;margin-bottom:18px}
  .hero h1{font-family:"STSong","SimSun",serif;font-size:clamp(30px,6vw,44px);letter-spacing:14px;color:var(--gold2);text-shadow:0 2px 40px rgba(216,192,145,.3)}
  .hero p{color:var(--sub);font-size:13px;letter-spacing:4px;margin-top:16px;font-family:"STSong","SimSun",serif}
  .hero .rule{width:180px;height:1px;margin:22px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
  .grid{max-width:860px;margin:30px auto 0;padding:0 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
  a.card{display:block;text-decoration:none;background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:6px;padding:26px 22px;transition:all .25s;color:var(--ink)}
  a.card:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:0 12px 40px rgba(0,0,0,.5)}
  a.card .no{font-size:11px;color:var(--gold);letter-spacing:3px}
  a.card h2{font-family:"STSong","SimSun",serif;font-size:19px;margin:8px 0 6px;color:var(--gold2);letter-spacing:3px}
  a.card p{font-size:13px;color:var(--sub);line-height:1.8}
  .foot{text-align:center;color:var(--sub);font-size:11px;letter-spacing:3px;padding:50px 0 40px}
</style>
</head>
<body>
<div class="hero">
  <div class="mono">HUA CHU JIN YU</div>
  <h1>花初锦遇 · 工具箱</h1>
  <div class="rule"></div>
  <p>选题 · 文案 · 镜头 —— 一个网址，全团队可用</p>
</div>
<div class="grid">
  <a class="card" href="xuanli.html">
    <div class="no">01</div>
    <h2>短视频选题器</h2>
    <p>八大分类点选组合 · 一键随机 · 口播稿生成 · 选题库管理 · 群消息导出</p>
  </a>
  <a class="card" href="wenan.html">
    <div class="no">02</div>
    <h2>短视频文案库</h2>
    <p>48条预置文案 · 八大分区 · 标签可改可自定义 · 回收站 · 一键复制</p>
  </a>
  <a class="card" href="jingtou.html">
    <div class="no">03</div>
    <h2>电影镜头图鉴</h2>
    <p>34个镜头语言 · 六大框架 · 每镜头配B站示范视频 · 电商拍摄专章</p>
  </a>
</div>
<div class="foot">花初锦遇 · 内部工具 · 请勿外传</div>
</body>
</html>
