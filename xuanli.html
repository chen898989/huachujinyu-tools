<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>9682# 短视频选题器 · 花初锦遇</title>
<style>
  :root{
    --bg:#faf6f2; --card:#ffffff; --ink:#3d2c22; --sub:#8a7364;
    --line:#eadfd5; --pri:#b06a3c; --pri-soft:#f6e8dc; --pri-line:#e3c9b2;
    --ok:#4a7c59; --ok-soft:#e7f1ea;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);padding:16px;padding-bottom:120px}
  .wrap{max-width:1080px;margin:0 auto}
  header{margin-bottom:18px}
  header h1{font-size:22px;letter-spacing:.5px}
  header h1 span{color:var(--pri)}
  header p{color:var(--sub);font-size:13px;margin-top:4px}
  .cat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
  .cat-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  .cat-head .no{font-size:11px;color:var(--pri);font-weight:700;background:var(--pri-soft);border-radius:6px;padding:2px 7px}
  .cat-head h2{font-size:15px}
  .cat-head .desc{font-size:12px;color:var(--sub)}
  .add{margin-left:auto;display:flex;gap:6px}
  .add input{border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12px;width:150px;outline:none}
  .add input:focus{border-color:var(--pri-line)}
  .add button{border:none;background:var(--pri);color:#fff;border-radius:8px;padding:5px 11px;font-size:12px;cursor:pointer}
  .tags{display:flex;flex-wrap:wrap;gap:8px}
  .tag{border:1px solid var(--line);border-radius:20px;padding:6px 13px;font-size:13px;cursor:pointer;user-select:none;background:#fff;transition:all .15s}
  .tag:hover{border-color:var(--pri-line)}
  .tag.on{background:var(--pri);border-color:var(--pri);color:#fff}
  .tag .del{margin-left:6px;opacity:.55;font-size:11px}
  .tag .del:hover{opacity:1}
  .tag.custom.on .del{color:#fff}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
  .panel h3{font-size:15px;margin-bottom:10px}
  .result{background:var(--pri-soft);border:1px dashed var(--pri-line);border-radius:12px;padding:14px;font-size:14px;line-height:1.9}
  .result b{color:var(--pri)}
  .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  .btn{border:none;border-radius:10px;padding:10px 18px;font-size:14px;cursor:pointer;font-weight:600}
  .btn.pri{background:var(--pri);color:#fff}
  .btn.sec{background:#fff;border:1px solid var(--pri-line);color:var(--pri)}
  .btn.ok{background:var(--ok);color:#fff}
  .saved-list{margin-top:8px}
  .saved-item{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:13px;line-height:1.9;position:relative}
  .saved-item .del-saved{position:absolute;top:8px;right:10px;color:#c0392b;cursor:pointer;font-size:12px;opacity:.7}
  .saved-item .del-saved:hover{opacity:1}
  .empty{color:var(--sub);font-size:13px;padding:8px 0}
  .float-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.95);border-top:1px solid var(--line);padding:10px 16px;backdrop-filter:blur(6px)}
  .float-bar .inner{max-width:1080px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .float-bar .count{font-size:13px;color:var(--sub)}
  .trash{margin-top:10px}
  .trash-btn{font-size:12px;color:var(--sub);cursor:pointer;user-select:none}
  .trash-btn:hover{color:var(--pri)}
  .trash-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .tag.dead{border-style:dashed;color:var(--sub);background:#fafafa;font-size:12px}
  .tag.dead:hover{border-color:var(--pri-line);color:var(--pri)}
  .tag .del{margin-left:5px;opacity:.35;font-size:12px}
  .tag.on .del{color:#fff;opacity:.7}
  .tag .del:hover{opacity:1}
  .toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 20px;border-radius:22px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99}
  .toast.show{opacity:.95}
  @media(max-width:600px){ .add{margin-left:0;width:100%} .add input{flex:1;width:auto} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>9682# <span>星点提花蝴蝶结轻塑内裤</span> · 短视频选题器</h1>
    <p>七大分类点选组合 → 生成选题 → 加入选题库 → 复制/导出分配给拍剪和AI生成师</p>
  </header>

  <div id="cats"></div>

  <div class="panel">
    <h3>📝 当前选题组合</h3>
    <div class="result" id="result">还没有选择标签，点上方标签开始组合，或点下方「随机组合」。</div>
    <div class="result" id="scriptBox" style="display:none;margin-top:10px;background:#fff;border:1px solid var(--pri-line)"></div>
    <div style="margin-top:12px;border-top:1px dashed var(--line);padding-top:10px">
      <div style="font-size:13px;color:var(--sub);margin-bottom:8px">🔍 找同类视频 / 同行案例 —— 关键词会根据你选的标签自动生成，可手改：</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <input id="kw" style="border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;width:230px;outline:none" placeholder="搜索关键词…">
        <a class="btn sec" style="text-decoration:none;display:inline-block" target="_blank" onclick="this.href=goKw('https://www.douyin.com/search/')">抖音搜</a>
        <a class="btn sec" style="text-decoration:none;display:inline-block" target="_blank" onclick="this.href=goKw('https://www.kuaishou.com/search/video?searchKey=')">快手搜</a>
        <a class="btn sec" style="text-decoration:none;display:inline-block" target="_blank" onclick="this.href=goKw('https://www.xiaohongshu.com/search_result?keyword=')">小红书搜</a>
        <a class="btn sec" style="text-decoration:none;display:inline-block" target="_blank" onclick="this.href=goKw('https://www.bilibili.com/search?keyword=')">B站搜</a>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
        <a class="btn sec" style="text-decoration:none;display:inline-block" target="_blank" href="https://trendinsight.oceanengine.com">巨量算数（趋势/人群数据）</a>
        <a class="btn sec" style="text-decoration:none;display:inline-block" target="_blank" href="https://www.newrank.cn">新榜（同行榜单）</a>
        <a class="btn sec" style="text-decoration:none;display:inline-block" target="_blank" href="https://www.douyin.com">抖音网页版（手动刷同行）</a>
      </div>
    </div>
    <div class="btns">
      <button class="btn pri" onclick="randomPick()">🎲 随机组合一条</button>
      <button class="btn ok" onclick="genScript()">🎙 生成口播稿</button>
      <button class="btn sec" onclick="copyScript()">📋 复制口播稿</button>
      <button class="btn sec" onclick="clearSel()">清空选择</button>
    </div>
  </div>

  <div class="panel">
    <h3>📚 选题库（已加入 <span id="savedCount">0</span> 条）</h3>
    <div class="saved-list" id="savedList"></div>
    <div class="btns">
      <button class="btn sec" onclick="copyAll()">📋 复制全部</button>
      <button class="btn sec" onclick="exportCSV()">⬇️ 导出 CSV</button>
      <button class="btn sec" onclick="clearSaved()" style="color:#c0392b;border-color:#e8c4bc">清空选题库</button>
    </div>
  </div>
</div>

<div class="float-bar">
  <div class="inner">
    <span class="count" id="selCount">已选 0 项</span>
    <button class="btn pri" onclick="addSaved()">➕ 加入选题库</button>
    <button class="btn ok" onclick="copyCurrent()">📋 复制当前选题（群消息）</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const CATS = [
 {id:"aud", no:"01", name:"人群画像", desc:"视频拍给谁看", tags:["18-24岁","25-30岁","31-35岁","36-45岁","45岁以上","腰腹有肉","微胖身材","小肚腩","大腿有肉","臀部扁平","臀型不饱满","上班族","宝妈","学生党","自由职业者","久坐办公人群","精致女性","居家女性","运动女性","注重穿搭女性","性价比型","品质型","颜值型","实用型","囤货型","想要腰腹轻塑","想要提臀","喜欢高腰","追求舒适","注重隐形穿搭"]},
 {id:"pain", no:"02", name:"用户痛点", desc:"视频解决什么问题", tags:["腰头卷边","腰头下滑","腰头勒肉","腰头弹力不足","小肚腩明显","腰腹缺少包裹感","穿衣线条不平整","臀部扁平","臀型不饱满","包臀不完整","缺少承托感","裤脚勒腿","走路不舒服","久坐有束缚感","闷热","扎肤","面料不够柔软","弹力不足","白色裤子透色","紧身裙显痕","贴身裤不够隐形","普通内裤太单调","款式不好看","缺少精致感","洗后变形","腰头松垮","穿着不贴合"]},
 {id:"hook", no:"03", name:"吸睛钩子", desc:"前三秒怎么抓人", tags:["痛点式：内裤腰头总是卷边的姐妹看过来！","痛点式：脱下内裤腰上一圈红印的姐妹，进来！","痛点式：坐下一弯腰腰头就卷边，这种内裤别再买了！","提问式：你们买轻塑内裤，会先看哪个地方？","提问式：收腹裤越勒越有效？评论区吵起来了","提问式：90到160斤的姐妹，你们内裤多久没换对了？","反常识式：轻塑内裤好不好穿，真的不只是看收腹！","反常识式：内裤好不好，翻过来看腰头就知道了","对比式：同一件紧身裙，穿普通内裤 vs 穿这条，侧面差别一目了然","悬念式：这条内裤的腰头，为什么要做成蝴蝶结？","悬念式：这条裤80%的成本，都花在一圈腰头上","数字式：一条轻塑内裤，竟然藏着7个设计细节","数字式：3秒看懂什么叫交叉分区加压","视觉式：近距离看看这个交叉腰头设计","视觉式：五色全家福，哪个颜色先戳中你？","情绪式：终于找到一条颜值和设计都在线的内裤","情绪式：第一次穿收腹裤，忘了自己穿了塑形裤","场景式：久坐一天，才知道腰头设计有多重要","场景式：穿白色裙裤出门前，先看这条","好奇式：你见过把蝴蝶结做进加压结构里的内裤吗？","好奇式：为什么这条内裤敢叫『小腰封』？"]},
 {id:"sell", no:"04", name:"产品卖点", desc:"视频讲什么优势", tags:["交叉蝴蝶结加压腰头","小腰封结构","分段式双层加压带","反包氨纶胶腰头","腰腹轻塑","3D立体提臀","反重力提托结构","加宽裤脚","空气层奶皮","锦纶星点提花","柔润亲肤","桑蚕丝底裆","桑蚕丝底裆","10A抑菌底档","加长加宽底档","蝴蝶结造型","星点提花","五种颜色","轻奢精致感","特调粉底液肤色","大地色系美学","久坐不卷边","穿一天无红印","洗20次不变形","隐形无痕打底","送闺蜜礼盒感"]},
 {id:"scene", no:"05", name:"消费场景", desc:"在什么场景发生", tags:["日常通勤","久坐办公","居家休闲","瑜伽运动","健身训练","白色裙裤穿搭","紧身裙穿搭","贴身打底穿搭","出差旅行","日常换洗","产后妈妈日常","开车久坐","约会穿搭","旗袍/正装场合","经期前腰腹敏感期","换季囤货"]},
 {id:"form", no:"06", name:"内容形式", desc:"具体怎么拍", tags:["真人口播","产品特写","细节测评","对比展示","模特展示","场景剧情","第一视角","工厂实拍","AI视频","混剪卡点","口播+细节双画面","素人买家秀视角","闺蜜对话情景剧","办公室剧情植入","腰头拉伸回弹测试","卷边对比实测","五色试穿变色","尺码实拍讲解（90-160斤）"]},
 {id:"buy", no:"07", name:"购买动机", desc:"为什么下单", tags:["想要腰腹轻塑","想要臀部更有型","喜欢精致好看的设计","看重腰头结构","注重面料质感","想要日常穿着舒适","想要多颜色选择","想要组合装更划算","想送闺蜜或家人","被腰头测评种草","冲着桑蚕丝底裆来的","大码友好（140-160斤）","回购囤货","看了对比视频想试试","替代踩雷的旧收腹裤"]},
 {id:"goal", no:"08", name:"投放目标", desc:"这条素材测什么", tags:["测点击率","测转化率","测ROI","放量素材","品牌种草","测5秒完播","测评论互动","测直播间引流","测粉丝群转化"]},
 {id:"script", no:"09", name:"口播脚本模板", desc:"选一条做话术骨架", tags:["模板A·踩坑开场：卷边红印痛点→交叉腰头讲解→拉伸回弹实测→尺码促单","模板B·对比开场：普通腰头vs交叉腰头→分区加压原理→试穿侧影→颜色展示促单","模板C·场景开场：久坐一天下班回家→脱下无红印→倒讲腰头设计→组合装促单","模板D·细节控开场：一镜到底逐个讲7个设计细节→桑蚕丝底裆收尾","模板E·剧情开场：闺蜜问裙子显不显肚子→拿出这条→细节展示→人手两条"]},
];

const CUSTOM_KEY="t9682_custom", SAVED_KEY="t9682_saved", TRASH_KEY="t9682_trash";
let custom = JSON.parse(localStorage.getItem(CUSTOM_KEY)||"{}");
let saved = JSON.parse(localStorage.getItem(SAVED_KEY)||"[]");
let trash = JSON.parse(localStorage.getItem(TRASH_KEY)||"{}");   // {cid:[{tag,custom}]}
let trashOpen = {};
let sel = {}; CATS.forEach(c=>sel[c.id]=new Set());

function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1500);}
function persistCustom(){localStorage.setItem(CUSTOM_KEY,JSON.stringify(custom));}
function persistSaved(){localStorage.setItem(SAVED_KEY,JSON.stringify(saved));}
function persistTrash(){localStorage.setItem(TRASH_KEY,JSON.stringify(trash));}

function render(){
  const box=document.getElementById("cats"); box.innerHTML="";
  CATS.forEach(c=>{
    const tags=[...c.tags, ...(custom[c.id]||[])];
    const div=document.createElement("div"); div.className="cat";
    div.innerHTML=`<div class="cat-head"><span class="no">${c.no}</span><h2>${c.name}</h2><span class="desc">${c.desc}</span>
      <div class="add"><input placeholder="自定义标签…" onkeydown="if(event.key==='Enter')addTag('${c.id}',this)"><button onclick="addTag('${c.id}',this.previousElementSibling)">＋加入</button></div></div>
      <div class="tags">${tags.map(t=>`<span class="tag ${sel[c.id].has(t)?'on':''} ${ (custom[c.id]||[]).includes(t)?'custom':''}" onclick="toggle('${c.id}',this)" data-t="${t}">${t}<span class="del" title="删除（可撤回）" onclick="delTag(event,'${c.id}',this.dataset.t)">×</span></span>`).join("")}</div>
      ${renderTrash(c)}`;
    box.appendChild(div);
  });
  updateResult();
}

function toggle(cid,el){
  const t=el.dataset.t;
  sel[cid].has(t)?sel[cid].delete(t):sel[cid].add(t);
  el.classList.toggle("on");
  updateResult();
}
function addTag(cid,input){
  const v=(input.value||"").trim(); if(!v)return;
  custom[cid]=custom[cid]||[];
  if(!custom[cid].includes(v)) custom[cid].push(v);
  persistCustom(); input.value=""; render();
}
function delTag(e,cid,t){
  e.stopPropagation();
  const isCustom=(custom[cid]||[]).includes(t);
  if(isCustom) custom[cid]=custom[cid].filter(x=>x!==t);
  sel[cid].delete(t);
  trash[cid]=trash[cid]||[];
  if(!trash[cid].some(x=>x.tag===t)) trash[cid].push({tag:t,custom:isCustom});
  persistCustom(); persistTrash(); render(); toast("已删除「"+t.slice(0,12)+"」，可在分类下方回收站撤回");
}
function renderTrash(c){
  const items=trash[c.id]||[];
  if(!items.length) return "";
  const open=trashOpen[c.id];
  return `<div class="trash"><span class="trash-btn" onclick="trashOpen['${c.id}']=!trashOpen['${c.id}'];render()">🗑 回收站（${items.length}）${open?'▲':'▼'}</span>${open?`<div class="trash-tags">${items.map((x,i)=>`<span class="tag dead" onclick="restore('${c.id}',${i})">${x.tag} ↩︎恢复</span>`).join("")}<span class="tag dead" style="color:#c0392b" onclick="purge('${c.id}')">清空回收站</span></div>`:''}</div>`;
}
function restore(cid,i){
  const x=(trash[cid]||[])[i]; if(!x)return;
  if(x.custom){ custom[cid]=custom[cid]||[]; if(!custom[cid].includes(x.tag)) custom[cid].push(x.tag); }
  trash[cid].splice(i,1); if(!trash[cid].length) delete trash[cid];
  persistCustom(); persistTrash(); render(); toast("已恢复 ✅");
}
function purge(cid){ if(confirm("彻底清空该分类回收站？删除的标签将无法恢复。")){ delete trash[cid]; persistTrash(); render(); } }
// ---------- 找同类视频 ----------
function autoKw(){
  const parts=[];
  const aud=pick1("aud"), pain=pick1("pain"), sc=pick1("scene");
  if(aud)parts.push(aud.replace(/型|岁$/,""));
  if(pain)parts.push(pain);
  if(sc)parts.push(sc);
  return parts.length?"内裤 "+parts.slice(0,2).join(" "):"收腹内裤 腰头";
}
function syncKw(){
  const el=document.getElementById("kw");
  if(selCount()>0 && (!el.value || el.dataset.auto==="1")){ el.value=autoKw(); el.dataset.auto="1"; }
  else if(selCount()>0 && !el.dataset.auto){ el.dataset.auto="0"; }
}
function goKw(base){
  const el=document.getElementById("kw");
  const kw=(el.value||autoKw()).trim();
  return base+encodeURIComponent(kw);
}
document.getElementById("kw").addEventListener("input",function(){this.dataset.auto="0";});

function randomPick(){
  CATS.forEach(c=>{ sel[c.id]=new Set(); const all=[...c.tags,...(custom[c.id]||[])]; sel[c.id].add(all[Math.floor(Math.random()*all.length)]); });
  render();
}
function clearSel(){ CATS.forEach(c=>sel[c.id]=new Set()); document.getElementById("scriptBox").style.display="none"; render(); }

// ---------- 口播稿生成 ----------
function pick1(cid){ const a=[...(sel[c.id]||[])]; return a.length?a[Math.floor(Math.random()*a.length)]:""; }
function genScript(){
  if(selCount()===0){toast("请先选择标签");return;}
  const hook=pick1("hook")||"这条内裤的腰头，真的不一样。";
  const hookBody=hook.includes("：")?hook.split("：")[1]:hook;
  const sells=[...(sel.sell||[])];
  const scenes=[...(sel.scene||[])];
  const aud=[...(sel.aud||[])];
  const pain=[...(sel.pain||[])];
  const s1=sells[0]||"交叉蝴蝶结加压腰头";
  const s2=sells[1]||"反包氨纶胶腰头";
  const s3=sells.find(t=>t.includes("底裆")||t.includes("底档"))||"10A抑菌桑蚕丝底裆";
  const sc=scenes[0]||"日常通勤";
  const line=(t)=>t.includes("：")?t.split("：")[1]:t;
  const txt=`【口播稿】
开场：${line(hookBody)}

痛点承接：${pain[0]?"很多"+(aud[0]||"姐妹")+"都有这个烦恼——"+pain[0]+"。" : "很多姐妹买了收腹裤都说勒得难受。"}

  const box=document.getElementById("scriptBox");
  box.style.display="block";
  box.innerHTML="<b style='color:var(--pri)'>🎙 口播稿（按你选的标签生成，可再点一次换一版）</b><br>"+txt.replace(/【[^】]*】\n?/g,"<b>$&</b>").replace(/\n/g,"<br>");
  window._lastScript=txt;
}
function copyScript(){
  if(!window._lastScript){toast("先点「生成口播稿」");return;}
  navigator.clipboard.writeText(window._lastScript).then(()=>toast("口播稿已复制 ✅"));
}
function selCount(){ return CATS.reduce((n,c)=>n+sel[c.id].size,0); }

function comboText(o){
  return CATS.map(c=>`【${c.name}】${(o[c.id]||[]).join("；")||"—"}`).join("\n");
}
function updateResult(){
  document.getElementById("selCount").textContent=`已选 ${selCount()} 项`;
  if(selCount()>0) syncKw();
  const r=document.getElementById("result");
  if(selCount()===0){ r.innerHTML="还没有选择标签，点上方标签开始组合，或点下方「随机组合」。"; return; }
  const o={}; CATS.forEach(c=>o[c.id]=[...sel[c.id]]);
  r.innerHTML=CATS.map(c=> o[c.id].length?`<b>${c.name}：</b>${o[c.id].join("；")}`:"").filter(Boolean!.join("<br>");
}
function addSaved(){
  if(selCount()===0){toast("请先选择标签");return;}
  const o={}; CATS.forEach(c=>o[c.id]=[...sel[c.id]]);
  o.time=new Date().toLocaleString("zh-CN");
  saved.unshift(o); persistSaved(); renderSaved(); toast("已加入选题库 ✅");
}
function renderSaved(){
  const box=document.getElementById("savedList");
  document.getElementById("savedCount").textContent=saved.length;
  if(!saved.length){box.innerHTML='<div class="empty">选题库还是空的，组合一条加入吧。</div>';return;}
  box.innerHTML=saved.map((o,i)=>`<div class="saved-item"><span class="del-saved" onclick="delSaved(${i})">删除</span>${CATS.map(c=>o[c.id]&&o[c.id].length?`<b style="color:var(--pri)">${c.name}：</b>${o[c.id].join("；")}`:"").filter(Boolean).join("<br>")}<br><span style="color:var(--sub);font-size:12px">${o.time}</span></div>`).join("");
}
function delSaved(i){ saved.splice(i,1); persistSaved(); renderSaved(); }
function clearSaved(){ if(confirm("确定清空整个选题库？")){ saved=[]; persistSaved(); renderSaved(); } }
function copyCurrent(){
  if(selCount()===0){toast("还没有选择内容");return;}
  const o={}; CATS.forEach(c=>o[c.id]=[...sel[c.id]]);
  const msg="📌 今日选题（9682#）\n"+CATS.map(c=>o[c.id].length?`▪️ ${c.name}：${o[c.id].join("、")}`:"").filter(Boolean).join("\n") + "\n👉 拍剪按以上执行，有问题群里说";
  navigator.clipboard.writeText(msg).then(()=>toast("已复制群消息格式 ✅"));
}
function copyAll(){
  if(!saved.length){toast("选题库是空的");return;}
  const txt=saved.map((o,i)=>`📌 选题${i+1}（9682#${o.time}）\n`+CATS.map(c=>o[c.id]&&o[c.id].length?`▪️ ${c.name}：${o[c.id].join("、")}`:"").filter(Boolean).join("\n")).join("\n\n——————\n\n");
  navigator.clipboard.writeText("9682# 选题库 共"+saved.length+"条\n\n"+txt+"\n\n👉 拍剪和AI生成师按选题执行，跑量结果群里反馈").then(()=>toast("已复制全部（群消息格式）✅"));
}
function exportCSV(){
  if(!saved.length){toast("选题库是空的");return;}
  const head=CATS.map(c=>c.name).concat(["创建时间"]);
  const rows=saved.map(o=>CATS.map(c=>(o[c.id]||[]).join(" / ")).concat([o.time]));
  const esc=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const csv="\uFEFF"+[head,...rows].map(r=>r.map(esc).join(",")).join("\r\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  a.download="9682选题库.csv"; a.click(); toast("已导出 CSV ✅");
}
render(); renderSaved();
</script>
